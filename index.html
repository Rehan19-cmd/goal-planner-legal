<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Planner — Legal</title>
<style>
  :root { --ink:#1a1a1a; --muted:#5c5c5c; --line:#e4e4e4; --accent:#3b6ef5; --bg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8e8e8; --muted:#a0a0a0; --line:#2e2e2e; --accent:#7d9dff; --bg:#141414; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:480px; padding:32px 24px; }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 28px; }
  a.card { display:block; padding:16px 18px; border:1px solid var(--line);
    border-radius:10px; text-decoration:none; color:var(--ink); margin-bottom:12px; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; font-size:16px; }
  a.card span { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Master Planner</h1>
  <p>Legal documents</p>
  <a class="card" href="privacy-policy.html">
    <strong>Privacy Policy</strong>
    <span>What we collect, why, and who we share it with</span>
  </a>
  <a class="card" href="terms-of-service.html">
    <strong>Terms of Service</strong>
    <span>The agreement covering your use of the app</span>
  </a>
</main>
</body>
</html>
